apiVersion: v2
name: goat
description: |
  Helm chart for GOAT (Geo Open Accessibility Tool) — a WebGIS platform for
  spatial analysis, accessibility modeling, and collaborative mapping.

  v0.3.7 frees the `POSTGRES_*` env namespace on windmill workers / server
  for application use. Previously the chart set `POSTGRES_USER` /
  `POSTGRES_PASSWORD` to the *windmill database* credentials and built
  `DATABASE_URL` from them. That shadowed `POSTGRES_*` for any goatlib
  script (which reads them as the *application* DB connection), forcing
  operators into workarounds. The renames are now `_WMILL_DB_USER` /
  `_WMILL_DB_PASSWORD` — purely internal — and operators can set
  `POSTGRES_*` freely via `windmill.workers.<X>.config` (configmap envFrom)
  or `extraEnv` (secretKeyRefs). Pair this with `WHITELIST_ENVS` in the
  worker config so windmill exposes the env to user scripts at runtime.
type: application
version: 0.3.7
appVersion: "latest"   # default image tag; pin to a specific commit SHA in your values.yaml for production
icon: https://goat.plan4better.de/favicon.ico
home: https://github.com/plan4better/charts/tree/main/charts/goat
sources:
  - https://github.com/plan4better/charts        # chart source
  - https://github.com/plan4better/goat          # application source
maintainers:
  - name: plan4better
    email: info@plan4better.de
    url: https://plan4better.de
keywords:
  - goat
  - webgis
  - geospatial
  - accessibility
  - routing

# Sub-chart dependencies. Each is gated on `<name>.enabled` per the spec.
# Phase 1 only exercises `redis`; cnpg-operator is declared so the bundled
# profile renders correctly under `helm template`. Other deps (keycloak,
# rabbitmq, minio) land in Phase 2/3.
dependencies:
  - name: cloudnative-pg
    version: "0.22.x"
    repository: https://cloudnative-pg.github.io/charts
    condition: postgresql.operator.enabled
  - name: redis
    version: "20.5.x"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
