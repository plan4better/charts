apiVersion: v2
name: goat
description: |
  Helm chart for GOAT (Geo Open Accessibility Tool) — a WebGIS platform for
  spatial analysis, accessibility modeling, and collaborative mapping.

  v0.3.1 fixes the NextAuth Keycloak wiring (env var names + ordering for
  K8s `$(VAR)` substitution) and adds `extraVolumes`/`extraVolumeMounts`
  support on web, geoapi, and processes so operators can mount CA bundles
  (e.g. NODE_EXTRA_CA_CERTS / REQUESTS_CA_BUNDLE) for self-signed Keycloak
  setups.
type: application
version: 0.3.1
appVersion: "latest"   # default image tag; pin to a specific commit SHA in your values.yaml for production
icon: https://goat.plan4better.de/favicon.ico
home: https://github.com/plan4better/charts/tree/main/charts/goat
sources:
  - https://github.com/plan4better/charts        # chart source
  - https://github.com/plan4better/goat          # application source
maintainers:
  - name: plan4better
    email: info@plan4better.de
    url: https://plan4better.de
keywords:
  - goat
  - webgis
  - geospatial
  - accessibility
  - routing

# Sub-chart dependencies. Each is gated on `<name>.enabled` per the spec.
# Phase 1 only exercises `redis`; cnpg-operator is declared so the bundled
# profile renders correctly under `helm template`. Other deps (keycloak,
# rabbitmq, minio) land in Phase 2/3.
dependencies:
  - name: cloudnative-pg
    version: "0.22.x"
    repository: https://cloudnative-pg.github.io/charts
    condition: postgresql.operator.enabled
  - name: redis
    version: "20.5.x"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
