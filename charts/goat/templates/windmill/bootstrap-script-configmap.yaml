{{- /*
Python bootstrap script run by the post-install Job (see bootstrap-hook.yaml).

What it does, in order, idempotently:
  1. Waits for the windmill API to return 200 on /api/version
  2. Tries to log in as the configured superadmin with the DESIRED password
  3. If that fails, falls back to the default `changeme` password — if it
     succeeds, immediately rotates the password to the desired value
  4. Creates the configured workspace (swallows "already exists")
  5. Mints a non-expiring API token
  6. Writes the token to the configured K8s Secret via the in-cluster
     Kubernetes API (using the ServiceAccount mounted into the pod)

The script uses only the Python stdlib so no `pip install` is needed,
keeping the Job image (`python:3.11-slim`) minimal and fast.
*/}}
{{- if and .Values.windmill.server.enabled .Values.windmill.bootstrap.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goat.fullname" . }}-windmill-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" (dict "context" . "component" "windmill-bootstrap") | nindent 4 }}
data:
  bootstrap.py: |
    """Windmill post-install bootstrap. Idempotent."""
    import json
    import os
    import ssl
    import sys
    import time
    from urllib.error import HTTPError, URLError
    from urllib.request import Request, urlopen

    BASE = os.environ["WINDMILL_URL"].rstrip("/")
    WS = os.environ["WINDMILL_WORKSPACE"]
    EMAIL = os.environ["ADMIN_EMAIL"]
    DEFAULT_PASS = os.environ.get("DEFAULT_ADMIN_PASSWORD", "changeme")
    DESIRED_PASS = os.environ["DESIRED_ADMIN_PASSWORD"]
    TOKEN_SECRET = os.environ["TOKEN_SECRET_NAME"]
    TOKEN_KEY = os.environ.get("TOKEN_SECRET_KEY", "token")
    NS = os.environ["NAMESPACE"]

    def api(path, method="GET", body=None, token=None, json_resp=True):
        req = Request(f"{BASE}/api{path}", method=method)
        req.add_header("Content-Type", "application/json")
        if token:
            req.add_header("Authorization", f"Bearer {token}")
        data = json.dumps(body).encode() if body is not None else None
        with urlopen(req, data=data, timeout=30) as r:
            raw = r.read().decode()
        if not raw:
            return {} if json_resp else ""
        try:
            return json.loads(raw)
        except json.JSONDecodeError:
            return raw.strip()

    def try_login(email, password):
        try:
            res = api("/auth/login", method="POST",
                     body={"email": email, "password": password},
                     json_resp=False)
            return res if isinstance(res, str) and res else None
        except HTTPError:
            return None

    # 1. Wait for server
    for i in range(60):
        try:
            v = api("/version", json_resp=False)
            print(f"windmill ready: version={v!r}", file=sys.stderr)
            break
        except (HTTPError, URLError, TimeoutError) as e:
            print(f"  wait... {e}", file=sys.stderr)
            time.sleep(2)
    else:
        sys.exit("windmill server never became ready")

    # 2/3. Login + rotate password if still on default
    session = try_login(EMAIL, DESIRED_PASS)
    if session:
        print("logged in with desired password", file=sys.stderr)
    else:
        session = try_login(EMAIL, DEFAULT_PASS)
        if not session:
            sys.exit(f"cannot log in as {EMAIL} with default OR desired password")
        print(f"logged in with default password — rotating", file=sys.stderr)
        if DESIRED_PASS != DEFAULT_PASS:
            api("/users/setpassword", method="POST",
                body={"password": DESIRED_PASS}, token=session,
                json_resp=False)
            session = try_login(EMAIL, DESIRED_PASS)
            if not session:
                sys.exit("password rotation succeeded but re-login failed")
            print("password rotated", file=sys.stderr)

    # 4. Workspace (idempotent: swallow any failure — token mint below will
    # surface a genuinely-missing workspace anyway)
    try:
        api("/workspaces/create", method="POST",
            body={"id": WS, "name": WS}, token=session, json_resp=False)
        print(f"created workspace: {WS}", file=sys.stderr)
    except Exception as e:
        print(f"workspace create skipped: {e}", file=sys.stderr)

    # 5. Mint a non-expiring API token
    token = api("/users/tokens/create", method="POST",
               body={"label": "goat-chart-bootstrap", "expiration": None},
               token=session, json_resp=False)
    if not token or not isinstance(token, str):
        sys.exit(f"token mint failed: {token!r}")
    print(f"minted token: {token[:8]}...", file=sys.stderr)

    # 6. Write the token to a K8s Secret via the in-cluster API
    with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
        sa_token = f.read().strip()
    ctx = ssl.create_default_context(
        cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    )
    api_url = f"https://kubernetes.default.svc/api/v1/namespaces/{NS}/secrets"
    import base64
    body = {
        "apiVersion": "v1", "kind": "Secret",
        "metadata": {"name": TOKEN_SECRET},
        "type": "Opaque",
        "data": {TOKEN_KEY: base64.b64encode(token.encode()).decode()},
    }
    # Try create; if it exists, patch instead
    req = Request(api_url, method="POST",
                 data=json.dumps(body).encode(),
                 headers={"Authorization": f"Bearer {sa_token}",
                         "Content-Type": "application/json"})
    try:
        urlopen(req, context=ctx, timeout=10).read()
        print(f"created secret {NS}/{TOKEN_SECRET}", file=sys.stderr)
    except HTTPError as e:
        if e.code != 409:
            sys.exit(f"create secret failed: {e.code} {e.read().decode()}")
        # Already exists — patch
        patch_url = f"{api_url}/{TOKEN_SECRET}"
        patch_body = {"data": {TOKEN_KEY: base64.b64encode(token.encode()).decode()}}
        req = Request(patch_url, method="PATCH",
                     data=json.dumps(patch_body).encode(),
                     headers={"Authorization": f"Bearer {sa_token}",
                             "Content-Type": "application/merge-patch+json"})
        urlopen(req, context=ctx, timeout=10).read()
        print(f"patched secret {NS}/{TOKEN_SECRET}", file=sys.stderr)

    print("bootstrap done")
{{- end -}}
