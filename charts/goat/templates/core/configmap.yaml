{{- if .Values.core.enabled -}}
{{- $authWired := and .Values.core.auth.enabled .Values.core.auth.existingSecret -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goat.serviceFullname" (dict "context" . "component" "core") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" (dict "context" . "component" "core") | nindent 4 }}
data:
  {{- range $k, $v := .Values.core.config }}
  {{- /* Omit Keycloak placeholders when auth is wired via existingSecret, and
         GOAT_PROCESSES_URL (emitted by the auto-wire below so it isn't
         rendered twice when an operator sets it explicitly) */}}
  {{- if or (and $authWired (or (eq $k "KEYCLOAK_SERVER_URL") (eq $k "REALM_NAME"))) (eq $k "GOAT_PROCESSES_URL") -}}
  {{- /* skip */ -}}
  {{- else }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  POSTGRES_SERVER: {{ include "goat.postgresql.host" $ | quote }}
  POSTGRES_DB: {{ include "goat.postgresql.database" $ | quote }}
  POSTGRES_PORT: {{ include "goat.postgresql.port" $ | quote }}
  {{- if not $authWired }}
  AUTH: {{ .Values.core.auth.enabled | toString | quote }}
  {{- end }}
  {{- $processesUrl := .Values.core.config.GOAT_PROCESSES_URL | default (include "goat.processes.url" .) }}
  {{- if $processesUrl }}
  GOAT_PROCESSES_URL: {{ $processesUrl | quote }}
  {{- end }}
{{- end }}
