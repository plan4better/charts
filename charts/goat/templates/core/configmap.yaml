{{- if .Values.core.enabled -}}
{{- $auth := dict "values" .Values.core "root" . -}}
{{- $authWired := include "goat.auth.wired" $auth -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goat.serviceFullname" (dict "context" . "component" "core") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" (dict "context" . "component" "core") | nindent 4 }}
data:
  {{- range $k, $v := .Values.core.config }}
  {{- /* Omit the Keycloak placeholders when auth is wired to a Secret (the
         deployment sets them from it), and GOAT_PROCESSES_URL (emitted by the
         auto-wire below so it isn't rendered twice when an operator sets it
         explicitly) */}}
  {{- if or (and $authWired (has $k (list "KEYCLOAK_SERVER_URL" "REALM_NAME" "KEYCLOAK_CLIENT_ID" "KEYCLOAK_CLIENT_SECRET"))) (eq $k "GOAT_PROCESSES_URL") -}}
  {{- /* skip */ -}}
  {{- else }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  POSTGRES_SERVER: {{ include "goat.postgresql.host" $ | quote }}
  POSTGRES_DB: {{ include "goat.postgresql.database" $ | quote }}
  POSTGRES_PORT: {{ include "goat.postgresql.port" $ | quote }}
  {{- /* Wired: AUTH=true comes from the deployment env. Set explicitly in
         core.config / core.extraEnv: that value is used as is. */}}
  {{- if not (or $authWired (include "goat.env.userSet" (dict "values" .Values.core "key" "AUTH"))) }}
  AUTH: {{ include "goat.auth.value" $auth | quote }}
  {{- end }}
  {{- $processesUrl := .Values.core.config.GOAT_PROCESSES_URL | default (include "goat.processes.url" .) }}
  {{- if $processesUrl }}
  GOAT_PROCESSES_URL: {{ $processesUrl | quote }}
  {{- end }}
{{- end }}
