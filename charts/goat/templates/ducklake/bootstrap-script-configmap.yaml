{{- /*
DuckLake catalog bootstrap. Run once as a Helm post-install hook to
ATTACH the DuckLake catalog read-write — DuckDB creates the catalog
tables in Postgres + the parquet layout in S3 if either is missing.

Subsequent runs are idempotent: the ATTACH succeeds against an existing
catalog without re-creating anything.

This is THE bootstrap that geoapi/processes/core all read against in
their normal operation (they attach READ_ONLY when serving). Without
this Job, geoapi crashloops with "Existing DuckLake at metadata catalog
... does not exist".

The script is intentionally stdlib + duckdb only (no goatlib), so the
hook can run on a tiny `python:3.11-slim` image. duckdb is pinned to
1.4.3 because newer versions ship the DuckLake 0.4 metadata format
which goatlib's vendored extension version cannot read (we hit that
collision in civitas).

TODO once `python -m goatlib.storage.ducklake` is a real entrypoint
(plan4better/goat refactor — see chart README): replace this whole
ConfigMap with a one-liner Job that runs the goatlib command directly.
*/}}
{{- if .Values.ducklakeBootstrap.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goat.fullname" . }}-ducklake-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" (dict "context" . "component" "ducklake-bootstrap") | nindent 4 }}
data:
  init.py: |
    """One-shot DuckLake catalog bootstrap. Idempotent."""
    import os
    import duckdb

    pg_uri = (
        f"host={os.environ['PG_HOST']} "
        f"port={os.environ.get('PG_PORT', '5432')} "
        f"user={os.environ['PG_USER']} "
        f"password={os.environ['PG_PASS']} "
        f"dbname={os.environ['PG_DB']} "
        f"keepalives=1 keepalives_idle=30 "
        f"keepalives_interval=5 keepalives_count=5"
    )
    schema = os.environ.get("CATALOG_SCHEMA", "ducklake")
    data_path = os.environ.get("DATA_DIR", "/app/data/ducklake")
    os.makedirs(data_path, exist_ok=True)

    con = duckdb.connect()
    for ext in ("spatial", "httpfs", "postgres", "ducklake"):
        con.execute(f"INSTALL {ext}; LOAD {ext};")

    # S3 settings — used by DuckLake for storing parquet data. Empty
    # endpoint = use local filesystem only (fine for dev/test).
    if os.environ.get("S3_ENDPOINT"):
        endpoint = os.environ["S3_ENDPOINT"].replace("http://", "").replace("https://", "")
        con.execute("SET s3_endpoint = ?;", [endpoint])
        con.execute("SET s3_url_style = 'path';")
        con.execute("SET s3_use_ssl = ?;",
                   [os.environ.get("S3_USE_SSL", "false").lower() == "true"])
        if os.environ.get("S3_ACCESS_KEY"):
            con.execute("SET s3_access_key_id = ?;", [os.environ["S3_ACCESS_KEY"]])
        if os.environ.get("S3_SECRET_KEY"):
            con.execute("SET s3_secret_access_key = ?;", [os.environ["S3_SECRET_KEY"]])

    # No READ_ONLY → DuckDB creates the catalog if it doesn't exist.
    con.execute(
        f"ATTACH 'ducklake:postgres:{pg_uri}' AS lake ("
        f"  DATA_PATH '{data_path}',"
        f"  METADATA_SCHEMA '{schema}'"
        f")"
    )
    print(f"DuckLake initialized: schema={schema} data={data_path}")
    con.close()
{{- end -}}
